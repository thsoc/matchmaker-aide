dataSources:
  ds0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
#    不支持${MYSQL_HOST_0:192.168.2.20}
    jdbcUrl: jdbc:mysql://192.168.2.20:3306/matchmaker?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&autocommit=false&useLocalSessionState=false&useLocalTransactionState=false&rewriteBatchedStatements=true
    username: root
    password: 123456
    autoCommit: false  # 关闭自动提交
    connectionTimeout: 30000

