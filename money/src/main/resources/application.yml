  #    # 基本配置
  #    cluster:
  #      nodes:
  #        - 192.168.1.101:6379
  #        - 192.168.1.102:6379
  #        - 192.168.1.103:6379
  #      max-redirects: 3
  #    password: "your_password"
  #    timeout: 3000ms
