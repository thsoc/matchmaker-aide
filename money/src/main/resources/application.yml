  #        - 192.168.1.103:6379
  #      max-redirects: 3
  #    password: "your_password"
  #    timeout: 3000ms
  #
  #    # Redisson 配置
  #    redisson:
  #      config: |
  #        clusterServersConfig:
  #          nodeAddresses:
  #            - "redis://${spring.redis.cluster.nodes[0]}"
  #            - "redis://${spring.redis.cluster.nodes[1]}"
  #            - "redis://${spring.redis.cluster.nodes[2]}"
  #          password: ${spring.redis.password}
  #          masterConnectionPoolSize: 64
  #          slaveConnectionPoolSize: 64
  #          idleConnectionTimeout: 10000
  #          connectTimeout: ${spring.redis.timeout}
  #          timeout: ${spring.redis.timeout}


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: myVerySecureSecretKeyForMatchmakerAideApplicationThatIsAtLeast256BitsLong
  expiration: 7200  # 令牌过期时间（秒），默认2小时

logging:
  level:
    # 观察事务是否创建以及是否正确触发回滚
    org.springframework.transaction: DEBUG
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG

    # 观察 ShardingSphere 的分片路由和实际执行引擎
    org.apache.shardingsphere.core.route: DEBUG
    org.apache.shardingsphere.core.execute.sql.execute.engine: DEBUG


