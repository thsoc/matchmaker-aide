# Seata 配置
seata:
  enabled: true
  application-id: account-tcc-service
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
#  enable-auto-data-source-proxy: false  # 禁用自动代理，我们手动管理
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:192.168.2.20:8848}
      namespace: ${SEATA_NAMESPACE:}
      group: SEATA_GROUP
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:192.168.2.20:8848}
      namespace: ${SEATA_NAMESPACE:}
      group: SEATA_GROUP

