  #          timeout: ${spring.redis.timeout}



  # 数据源配置
  datasource:
    # 关键：使用 ShardingSphere 驱动
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # 关键：URL 指向独立的规则文件
    url: jdbc:shardingsphere:classpath:sharding.yaml



sharding:
  bucket:
    enabled: true


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: myVerySecureSecretKeyForMatchmakerAideApplicationThatIsAtLeast256BitsLong
  expiration: 7200  # 令牌过期时间（秒），默认2小时

logging:
  level:
    # 观察事务是否创建以及是否正确触发回滚
    org.springframework.transaction: DEBUG
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG

    # 观察 ShardingSphere 的分片路由和实际执行引擎
    org.apache.shardingsphere.core.route: DEBUG
    org.apache.shardingsphere.core.execute.sql.execute.engine: DEBUG
