server:
  port: 8083

spring:
  application:
    name: order-service
  cloud:
    nacos:
      # 确保这里的地址是实际 Nacos 服务器的地址
      server-addr: ${NACOS_ADDR:192.168.2.20:8848}
      discovery:
        username: nacos  # 根据你的 Nacos 控制台登录账号修改
        password: nacos  # 根据你的 Nacos 控制台登录密码修改
      # 配置中心
      config:
        import-check:
          enabled: false                # 可选：关闭强制校验
        import:
          # 方式一：使用默认规则拉取（自动拼接为 order-service.yaml）
          - optional:nacos:${spring.application.name}.yaml?refreshEnabled=true

          # 方式二：显式指定拉取特定的配置文件（例如 abcs.yaml）
          # - optional:nacos:abcs.yaml?refreshEnabled=true

  jackson:
    generator:
      write_numbers_as_strings: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.2.20}:3306/matchmaker?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  redis:
    host: ${REDIS_HOST:192.168.2.20}
    port: 6379
    password: ${REDIS_PASSWORD:123456}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: myVerySecureSecretKeyForMatchmakerAideApplicationThatIsAtLeast256BitsLong
  expiration: 7200  # 令牌过期时间（秒），默认2小时

# Seata 配置
seata:
  enabled: true
  application-id: order-service
  tx-service-group: default_tx_group
  # ★ 必须在这里写，不能省略
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 192.168.2.20:8091
    disable-global-transaction: false

  # 注册中心配置
  registry:
    type: nacos
    nacos:
      # Nacos地址
      server-addr: 192.168.2.20:8848
      # 命名空间
      namespace: ""
      group: SEATA_GROUP
      cluster: default
      # Seata Server注册的应用名
      application: seata-server

  # 配置中心配置
  config:
    type: nacos
    nacos:
      server-addr: 192.168.2.20:8848
      namespace: ""
      group: SEATA_GROUP
      # 从Nacos获取配置的Data ID
      data-id: seata-client.yml
  # ★ 禁用 file 配置源
  file:
    enabled: false


# 日志配置
logging:
  level:
    # 观察事务是否创建以及是否正确触发回滚
    org.springframework.transaction: DEBUG
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG

    # 观察 ShardingSphere 的分片路由和实际执行引擎
    org.apache.shardingsphere.core.route: DEBUG
    org.apache.shardingsphere.core.execute.sql.execute.engine: DEBUG
    #    io.seata: DEBUG
    io.seata: INFO                 # 基本信息
    #    io.seata.core.rpc.netty: DEBUG # 心跳详情
    io.seata.rm: DEBUG             # 资源管理器细节
    io.seata.tm: DEBUG             # 事务管理器细节
    com.alibaba.nacos: INFO
  #    org.apache.shardingsphere: DEBUG
  file:
    name: logs/order-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

