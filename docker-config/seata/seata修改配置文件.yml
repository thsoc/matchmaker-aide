server:
  port: 7091

spring:
  application:
    name: seata-server

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${user.home}/logs/seata
  extend:
    logstash-appender:
      destination: 127.0.0.1:4560
    kafka-appender:
      bootstrap-servers: 127.0.0.1:9092
      topic: logback_to_logstash

console:
  user:
    username: seata
    password: seata
# Seata 核心配置
seata:
  # ========== 配置中心 (Config Center) ==========
  config:
    type: nacos  # 支持: nacos, consul, apollo, zk, etcd3
    nacos:
#      server-addr: 192.168.2.20:8848  # ⚠️ 替换为真实的 Nacos IP 地址
      server-addr: nacos:8848  # ⚠️ 替换为真实的 Nacos IP 地址
      namespace: ""                  # 命名空间 ID，为空则为 public
      group: SEATA_GROUP             # 分组名称，需与客户端保持一致
      username: nacos                # Nacos 账号（若开启了鉴权）
      password: nacos                # Nacos 密码
      data-id: seataServer.properties # 动态配置文件名
  # ========== 注册中心 (Registry Center) ==========
  registry:
    type: nacos  # 支持: nacos, eureka, redis, zk, consul, etcd3, sofa
    nacos:
      application: seata-server      # 注册的服务名称
#      server-addr: 192.168.2.20:8848  # ⚠️ 替换为真实的 Nacos IP 地址
      server-addr: nacos:8848  # 替换为真实的 Nacos IP 地址
      namespace: ""
      group: SEATA_GROUP
      cluster: default               # TC 集群名称
      username: nacos
      password: nacos

  # ========== 事务日志存储模式 ==========
  store:
    mode: db                         # 强烈建议使用 db 模式持久化
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 8.x 使用此驱动
#      url: jdbc:mysql://192.168.2.20:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false
      url: jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false
      user: root
      password: 123456
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      distributed-lock-table: distributed_lock
      min-conn: 5
      max-conn: 100
      query-limit: 100
      max-wait: 5000
  #  server:
  #    service-port: 8091 #If not configured, the default is '${server.port} + 1000'
  security:
    secretKey: SeataSecretKey0c382ef121d778043159209298fd40bf3850a017
    tokenValidityInMilliseconds: 1800000
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/api/v1/auth/login