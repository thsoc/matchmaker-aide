version: '3.8'

networks:
  mynet:
#    driver: bridge
    # 如果已有外部网络 mynet，取消下一行注释并删除上一行
    external: true


services:

  # ========== 单例 MySQL（供所有服务共用） ==========
  mysql:
    image: mysql:5.7
    container_name: mysql
    privileged: true
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      # 自动创建 nacos-config 库（Nacos 需要）
      MYSQL_DATABASE: nacos-config
    volumes:
      - /var/mysql/log:/var/log/mysql
      - /var/mysql/data:/var/lib/mysql
      - /var/mysql/conf.d:/etc/mysql/conf.d
      # 挂载 XXL-Job 初始化脚本（自动创建 xxl_job 库并建表）
      - ./tables_xxl_job.sql:/docker-entrypoint-initdb.d/01-tables_xxl_job.sql:ro
    networks:
      - mynet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ========== Nacos ==========
  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: nacos
    privileged: true
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      JVM_XMS: 512m
      JVM_XMX: 512m
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos-config
      MYSQL_SERVICE_USER: nacos-config
      MYSQL_SERVICE_PASSWORD: "123456"
    volumes:
      - /var/nacos/logs:/home/nacos/logs
      - /var/nacos/conf:/home/nacos/conf
    networks:
      - mynet
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s  # 给Nacos 30秒的初始启动时间
    depends_on:
      mysql:
        condition: service_healthy

  # ========== Redis ==========
  redis:
    image: redis:7.2
    container_name: redis
    privileged: true
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /var/redis/redis.conf:/etc/redis/redis.conf
      - /var/redis/data:/data
      - /var/redis/redis.log:/etc/redis.log
    command: ["redis-server", "/etc/redis/redis.conf"]
    networks:
      - mynet

  # ========== Seata Server ==========
  seata-server:
    image: seataio/seata-server:1.5.2
    container_name: seata-server
    restart: always
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_IP: 192.168.2.20
      SEATA_PORT: 8091
    volumes:
      - /var/seata/config:/seata-server/resources
      - /var/seata/sessionStore:/seata-server/sessionStore
    networks:
      - mynet
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy   # 更严格可以自己写 healthcheck

  # ========== XXL-Job Admin ==========
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin
    restart: always
    ports:
      - "9080:8080"
    environment:
      PARAMS: >
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=123456
        --xxl.job.accessToken=
    volumes:
      - /var/xxl-job/logs:/data/applogs
    networks:
      - mynet
    depends_on:
      mysql:
        condition: service_healthy