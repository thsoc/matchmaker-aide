# 禁止所有模块加载
loadmodule ""

# 基本配置
port 6379
bind 0.0.0.0
dir /data
daemonize no
requirepass 123456
#logfile /var/log/redis/redis-server.log
logfile "/etc/redis.log"

# 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 安全
protected-mode yes
