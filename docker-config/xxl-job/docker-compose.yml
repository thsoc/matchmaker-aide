version: '3.8'

networks:
  mynet:
    driver: bridge

services:
  # ===== MySQL =====
  xxl-mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@123456
      MYSQL_DATABASE: xxl_job
    ports:
      - "13306:3306"
    volumes:
      # ① 把官方 SQL 脚本挂进去，MySQL 首次启动会自动执行
      - ./tables_xxl_job.sql:/docker-entrypoint-initdb.d/tables_xxl_job.sql
      - xxl-mysql-data:/var/lib/mysql
    networks:
      - xxl-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===== XXL-Job Admin 调度中心 =====
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin
    restart: always
    depends_on:
      xxl-mysql:
        condition: service_healthy
    ports:
      - "9080:8080"
    environment:
      # 关键点：通过 PARAMS 往 admin 的 Spring 启动参数里灌
      PARAMS: >
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://xxl-mysql:3306/xxl_job?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=Root@123456
        --xxl.job.accessToken=
    volumes:
      - xxl-logs:/data/applogs
    networks:
      - mynet

volumes:
  xxl-mysql-data:
  xxl-logs: