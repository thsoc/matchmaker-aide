# ==================== bootstrap.yml ====================
# 注意：Spring Cloud 2020+ 需要添加 spring-cloud-starter-bootstrap 依赖

spring:
  application:
    name: member-service

  # 配置中心配置
  cloud:
    nacos:
      # 配置中心
      config:
        server-addr: 192.168.2.20:8848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: public
        refresh-enabled: true

      # 服务发现
      discovery:
        server-addr: 192.168.2.20:8848
        group: DEFAULT_GROUP
        namespace: public
        username: nacos
        password: nacos

# ==================== Seata客户端配置 ====================
seata:
  # 启用Seata
  enabled: true

  # 【关键】必须设置为false，避免与ShardingSphere的自动代理冲突
  enable-auto-data-source-proxy: false

  # 应用ID - 必须与seata.conf中的application.id保持一致
  application-id: ${spring.application.name}

  # 事务组名称
  tx-service-group: default_tx_group

  # 服务端配置
  service:
    # 事务组映射配置
    vgroup-mapping:
      default_tx_group: default

    # Seata Server地址列表
    grouplist:
      default: 192.168.2.20:8091

    # 不禁用全局事务
    disable-global-transaction: false

  # 注册中心配置
  registry:
    type: nacos
    nacos:
      # Nacos地址
      server-addr: 192.168.2.20:8848
      # 命名空间
      namespace: public
      group: SEATA_GROUP
      cluster: default
      username: nacos
      password: nacos
      # Seata Server注册的应用名
      application: seata-server

  # 配置中心配置
  config:
    type: nacos
    nacos:
      server-addr: 192.168.2.20:8848
      namespace: public
      group: SEATA_GROUP
      username: nacos
      password: nacos
      # 从Nacos获取配置的Data ID
      data-id: seata-server.yaml

# 日志配置
logging:
  level:
    io.seata: DEBUG
    com.alibaba.nacos: INFO
    org.apache.shardingsphere: DEBUG
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  # 添加以下配置，让 ShardingSphere 能从 Spring 环境中读取
  sharding:
    transaction:
      seata:
        at:
          enable: true
        tx:
          timeout: 60
