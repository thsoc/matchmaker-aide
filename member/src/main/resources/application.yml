server:
  port: 8081

spring:
  application:
    name: member-service
  cloud:
    nacos:
      discovery:
        # 确保这里的地址是实际 Nacos 服务器的地址
        server-addr: ${NACOS_ADDR:192.168.2.20:8848}

  jackson:
    generator:
      write_numbers_as_strings: true

#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://${MYSQL_HOST:192.168.2.20}:3306/matchmaker?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
#    username: root
#    password: 123456


  # 数据源配置
  datasource:
    # 关键：使用 ShardingSphere 驱动
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # 关键：URL 指向独立的规则文件
    url: jdbc:shardingsphere:classpath:sharding.yaml

  redis:
    host: ${REDIS_HOST:192.168.2.20}
    port: 6379
    password: ${REDIS_PASSWORD:123456}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: myVerySecureSecretKeyForMatchmakerAideApplicationThatIsAtLeast256BitsLong
  expiration: 7200  # 令牌过期时间（秒），默认2小时

seata:
  enabled: true
  # 【极其重要】必须显式关闭 Seata 原生的自动数据源代理！
  # 否则会和 ShardingSphere-JDBC 产生冲突，导致分片路由失败或事务不生效
  enable-auto-data-source-proxy: false
  tcc:
    fence:
      logTableName: tcc_fence_log

  tx-service-group: your-tx-group-name
  service:
    vgroup-mapping:
      your-tx-group-name: default
