# 注册中心配置
registry {
  # 注册中心类型：file、nacos、eureka、redis、zk、consul、etcd3、sofa
  type = "nacos"

  # Nacos配置
  nacos {
    # Nacos服务器地址
    serverAddr = "192.168.2.20:8848"
    # 命名空间（如果使用public，可以留空）
    namespace = ""
    # 分组
    group = "SEATA_GROUP"
    # 集群名称
    cluster = "default"
    # 用户名
    username = "nacos"
    # 密码
    password = "nacos"
    # 应用名
    application = "seata-server"
  }
}

# 配置中心配置
config {
  # 配置中心类型：file、nacos、apollo、zk、consul、etcd3
  type = "nacos"

  # Nacos配置中心
  nacos {
    # Nacos服务器地址
    serverAddr = "192.168.2.20:8848"
    # 命名空间
    namespace = ""
    # 分组
    group = "SEATA_GROUP"
    # 用户名
    username = "nacos"
    # 密码
    password = "nacos"
    # 从Nacos获取配置的Data ID
    dataId = "seata-client.yaml"
  }
}
